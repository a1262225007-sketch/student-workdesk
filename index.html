<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>学生部门工作台</title>
  <link rel="stylesheet" href="styles.css?v=20260919d">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">部</span>
        <div class="brand-text">
          <h1>学生部门工作台</h1>
          <p class="today-line" id="todayLine"></p>
        </div>
      </div>
      <div class="top-actions">
        <span id="dataBadge" class="sync-badge"><span class="sync-dot"></span><span id="dataStatus">读取中</span></span>
        <button id="refreshBtn" class="btn btn-ghost" type="button">
          <span data-icon="refresh"></span><span>刷新</span>
        </button>
      </div>
    </header>

    <main class="main">
      <section class="site-section" aria-labelledby="siteTitle">
        <div class="section-head">
          <div>
            <h2 id="siteTitle">站点入口</h2>
            <p class="section-sub">常用平台集中入口</p>
          </div>
          <div class="section-tools">
            <button id="openBothBtn" class="btn btn-primary" type="button">
              <span data-icon="external"></span><span>同时打开两个</span>
            </button>
          </div>
        </div>

        <div class="site-grid">
          <a class="site-entry erke" id="erkeEntry" href="https://erke.gdut.edu.cn/public/index.php/cgi/login" target="_blank" rel="noopener">
            <span class="site-mark" aria-hidden="true">素</span>
            <span class="site-copy">
              <strong id="siteName-erke">素拓平台</strong>
              <span class="site-url" id="siteUrl-erke">https://erke.gdut.edu.cn/public/index.php/cgi/login</span>
            </span>
            <span class="site-open" data-icon="external"></span>
          </a>

          <a class="site-entry mail" id="mailEntry" href="https://mail.163.com/" target="_blank" rel="noopener">
            <span class="site-mark" aria-hidden="true">邮</span>
            <span class="site-copy">
              <strong id="siteName-mail">163邮箱</strong>
              <span class="site-url" id="siteUrl-mail">https://mail.163.com/</span>
            </span>
            <span class="site-open" data-icon="external"></span>
          </a>
        </div>
      </section>

      <section class="modules">
        <section class="panel" aria-labelledby="noticeTitle">
          <header class="panel-head">
            <div>
              <h2 id="noticeTitle">公共通知</h2>
              <p class="panel-sub" id="noticeSub">0 条</p>
            </div>
          </header>
          <div class="panel-body">
            <ul class="notice-list" id="noticeList"></ul>
          </div>
        </section>

        <section class="panel" aria-labelledby="quickRegTitle">
          <header class="panel-head">
            <div>
              <h2 id="quickRegTitle">活动处理登记</h2>
              <p class="panel-sub">外部快速登记</p>
            </div>
          </header>
          <div class="panel-body quick-reg-body">
            <div class="quick-reg-mark" aria-hidden="true">
              <span data-icon="clipboard"></span>
            </div>
            <div class="quick-reg-copy">
              <h3 id="quickRegName">快速登记</h3>
              <p id="quickRegDescription"></p>
            </div>
            <a id="quickRegLink" class="btn btn-primary quick-reg-link" href="#" target="_blank" rel="noopener">
              <span data-icon="external"></span><span id="quickRegLabel">打开快速登记</span>
            </a>
          </div>
        </section>

        <section class="panel panel-wide" aria-labelledby="dutyTitle">
          <header class="panel-head">
            <div>
              <h2 id="dutyTitle">星期排班</h2>
              <p class="panel-sub" id="dutySub">0 个班次</p>
            </div>
          </header>
          <div class="panel-body table-body">
            <div class="duty-table" id="dutyTable" role="table" aria-label="星期排班"></div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
